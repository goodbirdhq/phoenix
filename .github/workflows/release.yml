name: Release

# Every release is an explicit request: no schedule and no tag trigger. Stable
# and nightly must be dispatched from the default branch; preview builds any
# branch for exercising the pipeline.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
          - preview
      version:
        description: "Stable version (for example 1.2.3 or v1.2.3). Required for stable."
        required: false
        type: string

# Keep pending requests instead of replacing the previous pending run, and
# never cancel an active publisher. Stable gets its own group so a nightly or
# preview never blocks it.
concurrency:
  group: release-${{ inputs.channel == 'stable' && 'stable' || 'nightly' }}
  cancel-in-progress: false
  queue: max

permissions:
  # The Windows desktop job reads this run's artifact list to wait for the
  # Linux CLI archive it embeds (see release-desktop.yml).
  actions: read
  contents: read
  id-token: none

jobs:
  preflight:
    name: Preflight
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Check release source
        uses: actions/github-script@v8
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const { assertReleaseSource } = require('./.github/scripts/check-release-source.cjs');
            await assertReleaseSource({ github, context, releaseChannel: process.env.RELEASE_CHANNEL });

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$DISPATCH_CHANNEL" == "nightly" || "$DISPATCH_CHANNEL" == "preview" ]]; then
            # A preview release is reachable only by asking for it: npm gets it
            # under the `preview` dist-tag, which nothing resolves by default,
            # its desktop builds carry no update feed, and no updater manifest
            # is attached to the release, so neither stable nor nightly
            # installs can ever be offered one.
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"

            node scripts/resolve-nightly-release.ts \
              --channel "$DISPATCH_CHANNEL" \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output

            echo "release_channel=$DISPATCH_CHANNEL" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=$DISPATCH_CHANNEL" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            raw="$DISPATCH_VERSION"
            if [[ -z "$raw" ]]; then
              echo "Stable releases require the version input." >&2
              exit 1
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=Phoenix v$version" >> "$GITHUB_OUTPUT"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "cli_dist_tag=next" >> "$GITHUB_OUTPUT"
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      # Share only the verification results, not the large registry metadata cache.
      - name: Upload dependency verification
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl

  quality:
    name: Release quality checks
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

  # Keep tests on their own runners, using the same package split and server
  # shards as CI (test, test_web, test_server in ci.yml). Keep the two in sync.
  test:
    name: Release tests
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

  # Web browser tests time out when they share a runner with the other package
  # suites: Chromium gets too little CPU and diff workers miss their 10s start budget.
  test_web:
    name: Release web tests
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        run: vp run --filter @t3tools/web test

  # Server test files run one at a time, so more small runners beat fewer big ones.
  test_server:
    name: Release server tests ${{ matrix.shard }}
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The platform-independent JS (server bundle, web client, Electron main) is
  # built exactly once here and handed to every platform job as `js-bundle`.
  # No T3 Connect configuration is baked in: Phoenix runs no relay.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      # pnpm checks the lockfile and policy before reusing this result. A missing
      # artifact leaves the cache empty, so installation runs the checks again.
      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Install bundle dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      # @t3tools/desktop#build compiles the Linux browser secret helper on a
      # Linux host before packing, and that needs libsecret headers.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # Runs t3#build (which depends on @t3tools/web#build) and
      # @t3tools/desktop#build, so apps/server/dist holds the server bundle
      # plus the web client and apps/desktop/dist-electron the Electron main.
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: ${{ github.repository == 'pingdotgg/t3code' && needs.preflight.outputs.release_channel || 'dev' }}
        run: vp run build:desktop

      # Two paths under apps/ so the artifact root is apps/; consumers download
      # into `apps` to restore both at their original locations.
      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # One job per target (see release-desktop.yml), each gated only on the JS
  # bundle. Phoenix ships macOS Apple Silicon and Windows x64 desktop apps;
  # Intel macOS, Windows arm64, and the Linux desktop app are not built. Every
  # job also builds its platform's CLI archive, which the npm launcher, the
  # install scripts, and `t3 update` download from the release.
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      label: macOS arm64
      runner: blacksmith-12vcpu-macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true

  # CLI archives only, each built on hardware of its own architecture. The x64
  # one is also the Windows WSL runtime, so the resource monitor is built for
  # musl to keep the archive loadable on glibc 2.28.
  cli_linux_x64:
    name: CLI Linux x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      # The Windows job waits for a job whose name ends in "Build Linux x64".
      label: Linux x64
      runner: blacksmith-8vcpu-ubuntu-2404
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-musl
      resource_key: linux-x64
      cli_archive: true
      desktop: false

  cli_linux_arm64:
    name: CLI Linux arm64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      label: Linux arm64
      runner: blacksmith-16vcpu-ubuntu-2404-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-musl
      resource_key: linux-arm64
      cli_archive: true
      desktop: false

  # Packaging is mostly CPU and small-file work, which Linux runners do faster
  # than Windows ones, so the target builds and signs on Linux and only the
  # native checks run on a GitHub-hosted Windows runner. It starts with the
  # other targets and waits for the Linux x64 CLI archive it embeds as the WSL
  # runtime after its other setup.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      label: Windows x64
      runner: blacksmith-16vcpu-ubuntu-2404
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  release:
    name: Publish GitHub Release
    needs:
      [
        preflight,
        quality,
        test,
        test_web,
        test_server,
        desktop_mac_arm64,
        cli_linux_x64,
        cli_linux_arm64,
        desktop_win_x64,
      ]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.quality.result == 'success' && needs.test.result == 'success' && needs.test_web.result == 'success' && needs.test_server.result == 'success' && needs.desktop_mac_arm64.result == 'success' && needs.cli_linux_x64.result == 'success' && needs.cli_linux_arm64.result == 'success' && needs.desktop_win_x64.result == 'success' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # electron-builder's config dump, not an updater feed. Every desktop job
      # emits one.
      - name: Drop build config dumps
        run: rm -f release-assets/builder-debug.yml

      # Installers verify archives against this file, so it is written from the
      # signed bytes that get uploaded, never from an earlier stage.
      - name: Write CLI archive checksums
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(*-"$VERSION"-{darwin,linux,win32}-*.{tar.gz,zip})
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # The desktop build omits the publish config for preview versions, so
      # electron-builder emits no updater manifests for them. Refuse to publish
      # if one shows up anyway: a `latest*.yml` or `nightly*.yml` on a preview
      # release is what would let a stable or nightly install update onto it.
      - name: Refuse updater metadata on preview releases
        if: needs.preflight.outputs.release_channel == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          updater_files=(release-assets/*.yml release-assets/*.blockmap)
          if [[ ${#updater_files[@]} -ne 0 ]]; then
            printf 'Preview releases must not carry updater metadata, found: %s\n' "${updater_files[*]}" >&2
            exit 1
          fi

      # electron-updater reads one manifest per platform and channel and picks
      # the file entry whose name carries the running arch, so the per-arch
      # manifests the build jobs wrote are merged back into that one file.
      # With only Windows x64 built, the Windows merge is a rename.
      - name: Merge macOS updater manifests
        if: needs.preflight.outputs.release_channel != 'preview'
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - name: Merge Windows updater manifests
        if: needs.preflight.outputs.release_channel != 'preview'
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-win-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}-arm64.yml"
            merged_manifest="${x64_manifest%-win-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform win "$x64_manifest" "$arm64_manifest" "$merged_manifest"
              rm -f "$x64_manifest" "$arm64_manifest"
            else
              mv "$x64_manifest" "$merged_manifest"
            fi
          done

      # Every target's installers, CLI archive, and, for channels an updater
      # follows, blockmaps and exact feed. A release missing one platform's
      # feed silently strands that platform's updates, and a missing CLI
      # archive breaks `t3 update` and the installers there. Keep in step with
      # the targets above. Names are matched by version and platform, not
      # product name.
      - name: Check required release assets
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CHANNEL: ${{ needs.preflight.outputs.release_channel }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          required=(
            "*-$VERSION-arm64.dmg"
            "*-$VERSION-arm64.zip"
            "*-$VERSION-x64.exe"
            "*-$VERSION-darwin-arm64.tar.gz"
            "*-$VERSION-linux-x64.tar.gz"
            "*-$VERSION-linux-arm64.tar.gz"
            "*-$VERSION-win32-x64.zip"
            "SHA256SUMS"
          )
          if [[ "$CHANNEL" != "preview" ]]; then
            feed="latest"
            [[ "$CHANNEL" == "nightly" ]] && feed="nightly"
            required+=(
              "*-$VERSION-arm64.dmg.blockmap"
              "*-$VERSION-arm64.zip.blockmap"
              "*-$VERSION-x64.exe.blockmap"
              "$feed-mac.yml"
              "$feed.yml"
            )
          fi
          missing=()
          for pattern in "${required[@]}"; do
            matches=(release-assets/$pattern)
            [[ ${#matches[@]} -eq 1 ]] || missing+=("$pattern (${#matches[@]} found)")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing or ambiguous release assets: %s\n' "${missing[*]}" >&2
            ls -la release-assets/ >&2
            exit 1
          fi

      # A preview release gets a warning instead of generated notes. Generated
      # notes would list every commit since the previous preview, which is
      # unmerged branch history no one should read as a changelog.
      - name: Write preview release notes
        if: needs.preflight.outputs.release_channel == 'preview'
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          > [!WARNING]
          > **This is a preview build. Do not install it unless you know exactly why you are here.**
          >
          > Preview builds are cut by maintainers from unreleased branches to exercise the release pipeline. They can be broken, receive no fixes, are never offered as updates, and are not supported. Install the [latest release](https://github.com/${{ github.repository }}/releases/latest) or a nightly instead.

          Built from `${{ needs.preflight.outputs.ref }}`.
          EOF

      # gh rather than softprops/action-gh-release: the action 403s creating
      # releases on this repository even with contents: write, while gh with
      # the same token works.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          TARGET: ${{ needs.preflight.outputs.ref }}
          RELEASE_NAME: ${{ needs.preflight.outputs.release_name }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
          CHANNEL: ${{ needs.preflight.outputs.release_channel }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.dmg release-assets/*.zip release-assets/*.exe release-assets/*.tar.gz release-assets/SHA256SUMS)
          # Updater manifests and blockmaps only go on channels an updater follows.
          if [[ "$CHANNEL" != "preview" ]]; then
            assets+=(release-assets/*.blockmap release-assets/*.yml)
          fi

          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing assets."
            gh release upload "$TAG" --clobber "${assets[@]}"
            exit 0
          fi

          args=(
            --target "$TARGET"
            --title "$RELEASE_NAME"
            --latest="$MAKE_LATEST"
          )
          if [[ "$CHANNEL" == "preview" ]]; then
            args+=(--notes-file release-notes.md)
          else
            args+=(--generate-notes)
            if [[ -n "$PREVIOUS_TAG" ]]; then
              args+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${assets[@]}" "${args[@]}"

  finalize:
    name: Finalize release
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' }}
    needs: [preflight, release]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      # Without the release GitHub App the workflow token pushes the version
      # bump, and the commit comes from github-actions[bot].
      - id: app_token
        name: Mint release app token
        if: ${{ env.HAS_RELEASE_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || github.token }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: app_bot
        name: Resolve GitHub App bot identity
        if: ${{ steps.app_token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/oxlint-plugin-t3code...

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "${{ steps.app_bot.outputs.name || 'github-actions[bot]' }}"
          git config user.email "${{ steps.app_bot.outputs.email || '41898282+github-actions[bot]@users.noreply.github.com' }}"

          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml
          git commit -m "chore(release): prepare $RELEASE_TAG"
          git push origin HEAD:main

  announce_discord:
    name: Announce release on Discord
    if: |
      always() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.release_channel != 'preview' &&
      needs.release.result == 'success' &&
      (needs.finalize.result == 'success' || needs.finalize.result == 'skipped')
    needs: [preflight, release, finalize]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Read published release notes
        if: needs.preflight.outputs.is_prerelease == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.release_channel }}
        run: |
          if [ "$RELEASE_CHANNEL" = 'nightly' ]; then
            if ! gh release view "$RELEASE_TAG" --json body --jq '.body // ""' > "$RUNNER_TEMP/discord-release-notes.md"; then
              : > "$RUNNER_TEMP/discord-release-notes.md"
              echo '::warning::Could not read published release notes; announcing without a changelog.'
            fi
          else
            : > "$RUNNER_TEMP/discord-release-notes.md"
          fi

      - name: Announce prerelease on Discord
        if: needs.preflight.outputs.is_prerelease == 'true'
        continue-on-error: true
        env:
          DISCORD_MENTION_ROLE_ID: ${{ secrets.DISCORD_RELEASE_NIGHTLY_ROLE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          node scripts/notify-discord-release.ts prerelease \
            --role-id "$DISCORD_MENTION_ROLE_ID" \
            --release-name "${{ needs.preflight.outputs.release_name }}" \
            --release-version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.preflight.outputs.tag }}" \
            --release-notes-file "$RUNNER_TEMP/discord-release-notes.md"

      - name: Announce latest release on Discord
        if: needs.preflight.outputs.make_latest == 'true'
        continue-on-error: true
        env:
          DISCORD_MENTION_ROLE_ID: ${{ secrets.DISCORD_RELEASE_LATEST_ROLE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          node scripts/notify-discord-release.ts latest \
            --role-id "$DISCORD_MENTION_ROLE_ID" \
            --release-name "${{ needs.preflight.outputs.release_name }}" \
            --release-version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.preflight.outputs.tag }}"
